[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perceul"
version = "0.5.2"
description = "A framework for unsupervised profiling of perception and cognitive-environmental ergonomics in the workplace."
readme = "README.md"
authors = [
    { name = "Jasper Gomez", email = "gomezjasper123@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.10"

dependencies = [
    "gradio>=6.20.0",
    "hdbscan>=0.8",
    "joblib>=1.5",
    "matplotlib>=3.11",
    "numpy>=1.26",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "umap-learn>=0.5"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"perceul.assets" = ["*.pkl"]

[project.urls]
Homepage = "https://github.com/jasper-gomez/perceul"